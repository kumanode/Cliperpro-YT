name: build-release

# Builds the Windows desktop app (Tauri + Python sidecar) on a Windows
# runner and publishes the portable + update zips to a GitHub Release.
#
# Triggers:
#   - push a tag like v2.0.7-beta  -> builds & publishes that version
#   - manual run (workflow_dispatch) with a version input -> test build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label (e.g. 2.0.144). Leave empty to use package.json version."
        required: false
        type: string
      publish_release:
        description: "Publish portable & update zips to GitHub Release"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version label
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}".Trim()
          if (-not $v -and "${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            if ($tag.StartsWith("v")) { $tag = $tag.Substring(1) }
            $v = $tag
          }
          if (-not $v) {
            $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Output "Resolved version: $v"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies (sidecar)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run Python unit tests
        run: python -m pytest tests -v

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch bundled ffmpeg + deno
        run: npm run deps

      - name: Download MediaPipe face_landmarker model
        shell: pwsh
        run: |
          $dir = "src-tauri\binaries\models"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $f = Join-Path $dir "face_landmarker.task"
          if (-not (Test-Path -LiteralPath $f) -or (Get-Item $f).Length -lt 1000000) {
            Invoke-WebRequest -Uri "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task" -OutFile $f
          }
          Get-Item $f | Select-Object Length

      - name: Build Python sidecar (PyInstaller)
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm `
            --distpath "src-tauri\binaries" `
            --workpath "build\sidecar" `
            "build\spec\sidecar.spec"
          Get-ChildItem "src-tauri\binaries\ytclip-sidecar-*.exe" | Select-Object Name, Length

      - name: Build frontend (Vite)
        run: npm run build

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path -Path "dist/index.html")) {
            Write-Error "dist/index.html missing! Frontend build failed."
          }
          Get-ChildItem "dist" -Recurse | Select-Object FullName

      - name: Build Tauri app + bundle
        run: npm run tauri build

      - name: Package portable zips
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File scripts/package-portable.ps1 -Version "${{ steps.version.outputs.VERSION }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ytsc-portable
          path: |
            src-tauri/target/release/bundle/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event.inputs.publish_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $tag = "v$version"
          $portable  = "src-tauri\target\release\bundle\YTShortClipperV2_${version}_x64_portable.zip"
          $update    = "src-tauri\target\release\bundle\YTShortClipperV2_${version}_x64_update.zip"
          # Create release only if it doesn't exist yet (so Windows & macOS jobs
          # can safely attach their assets to the same release without racing).
          gh release view $tag --json tagName -q .tagName 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --title "Cliperpro v$version" `
              --generate-notes `
              --target main
          }
          gh release upload $tag $portable --clobber
          gh release upload $tag $update --clobber